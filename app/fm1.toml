# JUNIPER FM-1's build settings (fm1-base tools/build.py)
name = "JUNIPERFM1"
id_prefix = "FM-1_61"            # package identity, this firmware's own
usb_manufacturer = "juniperfm1"
usb_product = "JUNIPER FM-1"
title = "JUNIPER FM-1"            # the name people see (firmware.json)
o2 = ["juno.c"]                  # the engine, at -O2
ble = true                       # Bluetooth MIDI (--no-ble builds without it)
companion = false
# the site and firmware.json
tagline = "a six-voice polysynth for the FM-1"
repo = "https://github.com/fergroan-sketch/juniper-fm1"
install = "https://fergroan-sketch.github.io/juniper-fm1/install/"   # (offline: "Open JUNIPER installer.command", http://localhost:8106/install/)
screenshot = "home.png"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp. Unofficial: not affiliated with or endorsed by Roland or M-VAVE."
author = "Fergus"
description = "A six-voice polysynth inspired by the Juno-106: one DCO per voice with saw, pulse/PWM, sub and noise, a high-pass, a resonant four-pole low-pass, one ADSR, an LFO with delay, and the stereo chorus I, II and I+II."
tags = ["synth"]
